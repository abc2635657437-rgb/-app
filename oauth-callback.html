<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Travel World · 登录</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f1e9;color:#173f4f;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(400px,calc(100% - 36px));padding:34px 26px;background:#fffdf8;border:1px solid #d8d3c6;text-align:center;box-shadow:0 20px 60px #173f4f14}h1{font:500 24px Georgia,"Songti SC",serif}.mark{font-size:32px;color:#b95644}.muted{color:#78817d;line-height:1.7}</style></head><body><main class="card"><div class="mark" id="mark">◌</div><h1 id="title">正在完成登录</h1><p class="muted" id="message">请稍候…</p></main><script>
const english=(()=>{try{return JSON.parse(localStorage.getItem('tw-state')||'{}').lang==='en'}catch{return false}})(),text=(zh,en)=>english?en:zh,params=new URLSearchParams(location.hash.slice(1)),title=document.getElementById('title'),message=document.getElementById('message'),mark=document.getElementById('mark');
async function finish(){const access_token=params.get('access_token'),refresh_token=params.get('refresh_token');if(!access_token||!refresh_token)throw new Error(text('登录回调缺少会话信息','The sign-in response did not include a session.'));const response=await fetch('/api/auth/session',{headers:{Authorization:`Bearer ${access_token}`}}),body=await response.json().catch(()=>({}));if(!response.ok||!body.user)throw new Error(body.error||text('无法验证登录状态','Could not verify the sign-in session.'));const expires_in=Number(params.get('expires_in')||3600);localStorage.setItem('tw-auth-session',JSON.stringify({access_token,refresh_token,token_type:params.get('token_type')||'bearer',expires_in,expires_at:Math.floor(Date.now()/1000)+expires_in,user:body.user}));history.replaceState({},'',location.pathname);mark.textContent='✓';title.textContent=text('登录成功','You’re signed in');message.textContent=text('即将返回 Travel World…','Returning to Travel World…');setTimeout(()=>location.replace('/'),500)}
finish().catch(error=>{history.replaceState({},'',location.pathname);mark.textContent='×';title.textContent=text('登录未完成','Sign-in could not be completed');message.textContent=error.message+' · '+text('请返回并重试','Return and try again');setTimeout(()=>location.replace('/?oauth_error=qq_failed'),3200)});
</script></body></html>
