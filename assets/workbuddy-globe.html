<desc>整幅按浮世绘（Ukiyo-e）画风绘制：和纸底纹、普鲁士蓝海洋、朱红日轮、墨线轮廓，右上角配竖排落款与朱印。大洲板块按真实世界的方位与相对大小铺开——北美、南美、格陵兰、欧洲、非洲、亚洲、澳洲各就其位，轮廓带出中美地峡、几内亚湾、好望角、中南半岛、印度次大陆、澳洲北湾等特征，并按气候带着色出撒哈拉沙漠、亚马逊雨林、喜马拉雅雪峰、格陵兰冰盖与澳洲红土。九座 Q 版造型的各国著名建筑——天坛、金字塔、埃菲尔铁塔、泰姬陵、圣瓦西里大教堂、大本钟、悉尼歌剧院、自由女神像与南美的里约基督像——都收在各自所属的大洲板块内。三个不同肤色的背包小人沿地球弧面从左向右行走。</desc>
