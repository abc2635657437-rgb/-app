<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel World · 邮箱验证</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef1ec;color:#173f4f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(420px,calc(100% - 32px));box-sizing:border-box;padding:38px;background:#fffdf8;border:1px solid #d8d3c6;text-align:center;box-shadow:0 20px 70px #173f4f18}h1{font-family:Georgia,"Songti SC",serif;font-weight:500}.mark{font-size:38px;color:#43806b}.error{color:#a64938}a,button{display:inline-block;margin-top:18px;padding:11px 18px;border:0;background:#173f4f;color:white;text-decoration:none}form{display:grid;gap:8px;margin-top:18px}input{padding:11px;border:1px solid #d8d3c6;font:inherit}</style></head><body><main class="card"><div id="mark" class="mark">⌛</div><h1 id="title">正在验证邮箱</h1><p id="message">请稍候，我们正在确认你的注册信息。</p><form id="resend" hidden><input id="email" type="email" placeholder="注册邮箱" required><button>重新发送验证邮件</button></form><a id="action" href="/" hidden>返回 Travel World</a></main><script>const hash=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search),error=hash.get('error_description')||query.get('error_description');const title=document.getElementById('title'),message=document.getElementById('message'),mark=document.getElementById('mark'),action=document.getElementById('action'),resend=document.getElementById('resend');function failed(text){mark.textContent='×';mark.className='mark error';title.textContent='验证链接已失效';message.textContent=text;action.hidden=false;resend.hidden=false}if(error)failed(decodeURIComponent(error)) ;else if(hash.get('access_token')){mark.textContent='✓';title.textContent='邮箱验证成功';message.textContent='注册已完成，即将返回 Travel World 登录。';action.hidden=false;setTimeout(()=>location.replace('/?verified=1'),1600)}else failed('验证链接无效或已经过期。');resend.onsubmit=async e=>{e.preventDefault();const button=resend.querySelector('button');button.disabled=true;button.textContent='正在发送…';try{const r=await fetch('/api/auth/resend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||'发送失败');message.textContent='新的验证邮件已发送，请检查收件箱。';resend.hidden=true}catch(err){message.textContent=err.message}finally{button.disabled=false;button.textContent='重新发送验证邮件'}};</script></body></html>
