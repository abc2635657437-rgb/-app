services:
  - type: web
    name: travel-world
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend --omit=dev
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: NOMINATIM_BASE_URL
        sync: false
      - key: OSRM_BASE_URL
        sync: false
      - key: OPEN_METEO_BASE_URL
        sync: false
