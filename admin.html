<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102d38"><title>Travel World · Admin Console</title><link rel="stylesheet" href="/admin.css?v=1"></head><body>
<aside><div class="brand"><span>TW</span><div><b>Travel World</b><small>OPERATIONS</small></div></div><nav><button class="active" data-view="dashboard">数据总览</button></nav><div class="operator" id="operator">只读数据看板<br>不展示完整 IP 或私密资料</div></aside>
<main><header><div><p id="eyebrow">OPERATIONS</p><h1 id="pageTitle">运营总览</h1></div><div class="live"><i></i><span id="liveText">实时连接中</span></div></header>
<section id="dashboard" class="view active"><div class="toolbar"><select id="range"><option value="7">最近 7 天</option><option value="30" selected>最近 30 天</option><option value="90">最近 90 天</option><option value="custom">自定义</option></select><input id="from" type="date" hidden><input id="to" type="date" hidden><button id="refresh">刷新</button></div><div class="metrics" id="metrics"></div><div class="grid"><article class="panel wide"><div class="panel-head"><h2>增长趋势</h2><span>注册 / 帖子 / 评论</span></div><div id="trend" class="chart"></div></article><article class="panel"><div class="panel-head"><h2>用户地域</h2><span>不展示 IP</span></div><div id="geo"></div></article></div><div class="grid thirds"><article class="panel"><h2>最新注册</h2><div id="latestUsers"></div></article><article class="panel"><h2>最新帖子</h2><div id="latestPosts"></div></article><article class="panel"><h2>最新评论</h2><div id="latestComments"></div></article></div></section>
<section id="content" class="view"><div class="toolbar"><input id="contentSearch" placeholder="搜索标题或正文"><input id="contentFrom" type="date"><input id="contentTo" type="date"><select id="contentSort"><option value="created_at">发布时间</option><option value="updated_at">更新时间</option></select><button id="contentGo">筛选</button></div><div id="posts" class="table"></div><div class="pager" id="postPager"></div></section>
<section id="users" class="view"><div class="toolbar"><input id="userSearch" placeholder="搜索昵称或用户名"><select id="userStatus"><option value="">全部状态</option><option value="active">正常</option><option value="suspended">已封禁</option></select><select id="userSort"><option value="created_at">注册时间</option><option value="last_active_at">最后活跃</option><option value="display_name">昵称</option></select><button id="userGo">筛选</button></div><div id="userTable" class="table"></div><div class="pager" id="userPager"></div></section>
<section id="audit" class="view"><div class="toolbar"><input id="auditSearch" placeholder="搜索操作或对象 ID"><button id="auditGo">搜索</button></div><div id="auditTable" class="table"></div><div class="pager" id="auditPager"></div></section>
</main><div id="toast" hidden></div><dialog id="detail"><button class="close" onclick="detail.close()">关闭</button><div id="detailBody"></div></dialog><script src="/admin.js?v=1"></script></body></html>
