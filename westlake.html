<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9f2ee">
<title>探索 · 西湖 | Travel World 同路人</title>
<meta name="description" content="西湖动态地图：湖面在流、游船在走，点一下就能看景点。">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/modules/westlake/westlake.css?v=1">
</head>
<body>
<div id="app">
  <!--
    The artwork. Everything that moves is painted over it in #fx; the controls
    live above both as transparent hotspots placed on the pixels the artwork
    already drew.
  -->
  <div id="plateWrap">
    <img id="plate" src="/assets/explore3d/plate.webp" alt="杭州西湖 · 三维地图画面">
    <canvas id="fx" width="1400" height="2131"></canvas>
  </div>

  <div id="tone" aria-hidden="true"></div>
  <div id="tapLayer" aria-hidden="true"></div>
  <div id="hotspots"></div>

  <!-- live selection marks that sit on top of the painted UI -->
  <span id="chipCover" class="selection-mark selection-mark--cover" aria-hidden="true"></span>
  <span id="chipMark" class="selection-mark selection-mark--chip" aria-hidden="true"></span>
  <span id="tabMark" class="selection-mark selection-mark--tab" aria-hidden="true"></span>

  <!-- the sheet's card row is the one piece of UI that really re-renders -->
  <div id="liveCards" class="live-cards" style="opacity:0;pointer-events:none"></div>

  <!-- search -->
  <div id="searchPanel" class="search-panel">
    <div class="search-panel__bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.2"/><path d="m15.4 15.4 4.2 4.2"/></svg>
      <input id="searchInput" type="search" placeholder="搜索西湖的景点" autocomplete="off">
      <button id="searchClose" type="button">取消</button>
    </div>
    <div id="searchList" class="search-list"></div>
  </div>

  <!-- layer + filter panels -->
  <div id="layerSheet" class="panel"></div>
  <div id="filterSheet" class="panel"></div>

  <!-- place sheet -->
  <div id="placeSheet" class="place-sheet">
    <div id="placeSheetBody" class="place-sheet__card"></div>
  </div>

  <div id="toast" role="status"></div>

  <div id="loading" class="is-visible">
    <div class="loading-ring"></div>
    <p>正在载入西湖</p>
  </div>
</div>
<script src="/modules/westlake/westlake.js?v=1"></script>
</body>
</html>
