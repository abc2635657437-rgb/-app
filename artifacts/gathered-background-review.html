<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gathered · 地标艺术背景</title><style>body{margin:0;background:#f6f2e8;color:#173747;font-family:system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:20px}h1{font:700 26px SimSun,Georgia,serif}p{font-size:13px;line-height:1.6}section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}figure{margin:0;min-width:0}img{width:100%;height:auto;display:block}h2{font:700 20px SimSun,Georgia,serif}a{color:inherit;text-underline-offset:3px}.links{display:flex;gap:14px;flex-wrap:wrap}.links a{padding:10px 0;min-height:24px}@media(max-width:700px){section{grid-template-columns:1fr}}</style></head><body><main><h1>Gathered · 地标艺术背景</h1><p>已完成的独立艺术背景 · 点击图片看原尺寸，点击“查看地点详情”在网站中查看应用效果。</p><p><a href="/">返回 Travel World</a></p><section id="works"></section><p id="status" role="status">正在加载成品…</p></main><script>
const names={'Q45178':['悉尼歌剧院','au-opera'],'Q9202':['自由女神像','us-liberty'],'Q12501':['长城','cn-great-wall'],'Q10866444':['西湖 · 三潭印月','cn-west-lake'],'Q243':['埃菲尔铁塔','fr-eiffel'],'Q9141':['泰姬陵','in-taj-mahal'],'Q19675':['卢浮宫','fr-louvre']};
fetch('/modules/data/place-backgrounds.json?v=1').then(r=>{if(!r.ok)throw Error();return r.json();}).then(data=>{for(const [id,[name,landmark]] of Object.entries(names)){const art=data.backgrounds[id];if(!art)continue;const figure=document.createElement('figure'),full=document.createElement('a'),image=document.createElement('img'),title=document.createElement('h2'),credit=document.createElement('p'),links=document.createElement('div');full.href=art.image;full.target='_blank';image.src=art.image;image.alt=name+' Gathered 艺术背景';image.loading='lazy';full.append(image);title.textContent=name;credit.textContent=art.sourceAuthor+' · '+art.license+' · AI 艺术衍生图';links.className='links';for(const [text,url] of [['查看地点详情','/?landmark='+landmark],['源图与署名',art.sourceUrl],['授权条款',art.licenseUrl]]){const a=document.createElement('a');a.textContent=text;a.href=url;if(url.startsWith('https:')){a.target='_blank';a.rel='noopener noreferrer';}links.append(a);}figure.append(full,title,credit,links);document.getElementById('works').append(figure);}document.getElementById('status').textContent='以上仅为已完成背景，不代表100张全部完成。背景经过艺术处理；地点实拍保持独立展示。';}).catch(()=>document.getElementById('status').textContent='背景目录暂时无法加载，请刷新重试。');
</script></body></html>
